<!-- PRODUCT CARD -->
<div class="product-card" onclick="openModal('Core Vital','IMAGE_NAME_HERE')">
  <img src="PRODUCT_IMAGE_HERE.jpg" alt="Core Vital" />

  <div class="product-content">
    <h3>Core Vital (180g)</h3>
    <p>Detox Health Drink</p>

    <div class="price">
      <span class="old-price">₹1000</span>
      ₹500 (50% OFF)
    </div>

    <div class="offer-badge">LIMITED OFFER</div>
  </div>
</div>


<!-- POPUP MODAL -->
<div class="modal" id="productModal">
  <div class="modal-content">

    <span class="close" onclick="closeModal()">&times;</span>

    <!-- DETAILS IMAGE -->
    <img id="detailsImage" src="" alt="Details Image"
    style="width:100%; border-radius:15px;" />

  </div>
</div>


<!-- CSS -->
<style>

.modal{
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal-content{
  background:white;
  width:100%;
  max-width:500px;
  border-radius:20px;
  padding:15px;
  position:relative;
  animation:popup 0.3s ease;
}

.close{
  position:absolute;
  right:15px;
  top:10px;
  font-size:32px;
  cursor:pointer;
}

@keyframes popup{
  from{
    transform:scale(0.7);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

.product-card{
  cursor:pointer;
}

</style>


<!-- JAVASCRIPT -->
<script>

function openModal(productName, imageName){

  document.getElementById("productModal").style.display = "flex";

  document.getElementById("detailsImage").src = imageName;

}

function closeModal(){

  document.getElementById("productModal").style.display = "none";

}

window.onclick = function(event){

  const modal = document.getElementById("productModal");

  if(event.target == modal){
    modal.style.display = "none";
  }

}

</script>
